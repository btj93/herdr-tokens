id = "herdr-tokens"
name = "Herdr Tokens"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Publishes workspace metadata tokens derived from agent status, so sidebar colours can vary by state"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-tokens", "./cmd/herdr-tokens"]

[[startup]]
command = ["./bin/herdr-tokens", "start"]

[[events]]
on = "pane.created"
command = ["./bin/herdr-tokens", "start"]

[[actions]]
id = "start"
title = "Start token daemon"
contexts = ["global"]
command = ["./bin/herdr-tokens", "start"]

[[actions]]
id = "stop"
title = "Stop token daemon"
contexts = ["global"]
command = ["./bin/herdr-tokens", "stop"]

[[actions]]
id = "validate-config"
title = "Validate token config"
contexts = ["global"]
command = ["./bin/herdr-tokens", "validate-config"]

[[actions]]
id = "preview"
title = "Preview tokens"
contexts = ["global"]
command = ["./bin/herdr-tokens", "preview"]
