name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race ./...
      - run: go build ./...

  # BACKSTOP, not the primary defence. Fixture sanitisation is enforced in
  # two earlier layers before anything reaches this job: scripts/capture-
  # fixture.sh sanitizes at capture time, and the tracked .githooks/pre-commit
  # hook (installed via `make install-hooks`) blocks an unsanitized fixture
  # from entering *local* history in the first place. By the time this job
  # runs, a leak is already on GitHub -- public, indexed, possibly cloned --
  # and the only remedy left is a history rewrite. This job exists purely to
  # catch the case where someone committed with `--no-verify` or cloned the
  # repo without ever running `make install-hooks`. Do not treat it as
  # redundant with the hook and remove the hook; it is the last line, not
  # the first.
  fixtures-are-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No home paths other than /Users/user
        run: |
          if grep -rEo '/Users/[^"/]+' testdata/ | grep -v '/Users/user$'; then
            echo "::error::testdata leaks a real home path"
            exit 1
          fi
      - name: No absolute home paths in any committed fixture
        run: |
          if grep -rE '/home/[^"/]+' testdata/ | grep -vE '/home/(user|runner)'; then
            echo "::error::testdata leaks a real home path"
            exit 1
          fi
      - name: No tilde-form paths
        run: |
          if grep -roE '~/[A-Za-z0-9_./-]+' testdata/ | grep -v '~/projects/app$'; then
            echo "::error::testdata leaks a tilde-form path"
            exit 1
          fi
      - name: Titles are generic
        run: |
          if grep -roE '"terminal_title[^"]*": "[^"]*"' testdata/ \
             | grep -vE ': "(shell|agent|nvim|)"$'; then
            echo "::error::testdata leaks a terminal title"
            exit 1
          fi
