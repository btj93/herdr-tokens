name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # DO NOT pin this to match go.mod's `go 1.22`. They are different
          # things and making them agree breaks the macOS job.
          #
          # go.mod's directive is the LANGUAGE FLOOR — the oldest Go a
          # consumer may build this module with. That stays at 1.22.
          # `go-version` here selects the TOOLCHAIN CI builds *with*, which
          # is unrelated to the declared minimum.
          #
          # Pinning 1.22 here fails on macos-latest, before a single test
          # runs: Go 1.22 links race-detector binaries without an LC_UUID
          # load command, and current macOS dyld rejects them —
          #   dyld: missing LC_UUID load command in ...herdr-tokens.test
          #   signal: abort trap
          # Every package aborts at binary load time (0.002-0.035s), which
          # looks like a broad test failure and is actually a
          # toolchain-versus-runner mismatch touching no project code.
          go-version: stable
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race ./...
      - run: go build ./...

  # BACKSTOP, not the primary defence. Fixture sanitisation is enforced in
  # two earlier layers before anything reaches this job: scripts/capture-
  # fixture.sh sanitizes at capture time, and the tracked .githooks/pre-commit
  # hook (installed via `make install-hooks`) blocks an unsanitized fixture
  # from entering *local* history in the first place. By the time this job
  # runs, a leak is already on GitHub -- public, indexed, possibly cloned --
  # and the only remedy left is a history rewrite. This job exists purely to
  # catch the case where someone committed with `--no-verify` or cloned the
  # repo without ever running `make install-hooks`. Do not treat it as
  # redundant with the hook and remove the hook; it is the last line, not
  # the first.
  fixtures-are-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # see note in the test job above
      # COARSE PRE-FILTER ONLY, not the guard. Each grep below inspects a
      # single extracted TOKEN (e.g. only the path segment immediately
      # after "/Users/"), never the whole decoded JSON string value. That
      # means something like "/Users/user/work/<client>" passes every one
      # of these checks: the extracted token is "/Users/user", which
      # matches the allowed value, and nothing here ever looks at what
      # comes after it. These greps exist only to fail fast and cheaply on
      # the common case; they are deliberately weaker than the real guard,
      # which is the step below.
      - name: (pre-filter) No home paths other than /Users/user
        run: |
          if grep -rEo '/Users/[^"/]+' testdata/ | grep -v '/Users/user$'; then
            echo "::error::testdata leaks a real home path"
            exit 1
          fi
      - name: (pre-filter) No absolute home paths in any committed fixture
        run: |
          if grep -rE '/home/[^"/]+' testdata/ | grep -vE '/home/(user|runner)'; then
            echo "::error::testdata leaks a real home path"
            exit 1
          fi
      - name: (pre-filter) No tilde-form paths
        run: |
          if grep -roE '~/[A-Za-z0-9_./-]+' testdata/ | grep -v '~/projects/app$'; then
            echo "::error::testdata leaks a tilde-form path"
            exit 1
          fi
      - name: (pre-filter) Titles are generic
        run: |
          if grep -roE '"terminal_title[^"]*": "[^"]*"' testdata/ \
             | grep -vE ': "(shell|agent|nvim|)"$'; then
            echo "::error::testdata leaks a terminal title"
            exit 1
          fi
      # AUTHORITATIVE CHECK. internal/herdrapi/schema.go decodes the WHOLE
      # fixture and validates it against a CLOSED positive schema: every
      # field present must be one the schema names, and have the exact
      # shape (literal, enum, or regex) that field is declared to have --
      # not a token extracted from a single line, and not a denylist of
      # known-bad shapes (see internal/herdrapi/schema.go's header and the
      # CHANGELOG "Known limitation" section for why a denylist was replaced
      # rather than extended). That closed schema, not the greps above, is
      # what actually decides whether a fixture is safe to publish; the
      # greps are a coarse, cheap pre-filter and nothing more.
      - name: Run authoritative fixture-schema assertions (Go tests)
        run: go test ./internal/herdrapi/... -run '^Test(ValidateFixture|TokensField|AllowedTokenKeysMirrorDerive)' -v
